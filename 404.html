<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGradeZapp</title>
    <link rel="icon" href="/WebGradeZapp/cologo.png" />
    <script src="https://cdn.lordicon.com/lordicon.js"></script>
    <script type="module" crossorigin src="/WebGradeZapp/assets/index-1rgg3VEN.js"></script>
    <link rel="stylesheet" crossorigin href="/WebGradeZapp/assets/index-Blj-XcU7.css">
  </head>
  <body>
    <div id="root"></div>

    <!-- ========== NEW PRELOADER ========== -->
    <div id="preloader">
      <!-- heading without typing animation -->
      <h1 class="write-heading">Welcome to WebGradeZapp</h1>

      <!-- centre block: logo + fb dots -->
      <div class="center-block">
        <img src="/WebGradeZapp/cologo.png" alt="logo" class="logo" />
        <div class="fb-dots"><span></span><span></span><span></span></div>
      </div>

      <!-- bottom footer -->
      <div class="bottom-footer">Built by <strong>Abdullah Waqas</strong></div>
    </div>

    <style>
      body {
        margin: 0;
        padding: 0;
      }
      /* ---------- full-screen wrapper ---------- */
      #preloader {
        position: fixed;
        inset: 0 0 0 0;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        background: #ffffff;
        transition: opacity 0.6s ease;
        transition: transform 0.5s ease;
        padding: 10vh 0 6vh;
      }

      /* ---------- heading ---------- */
      .write-heading {
        font-family: "Dancing Script", cursive;
        font-size: 2.75rem;
        color: #111827;
      }

      /* ---------- centre content ---------- */
      .center-block {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
      }
      .logo {
        width: 140px;
        height: 140px;
        -o-object-fit: contain;
           object-fit: contain;
      }

      /* ---------- facebook bouncing dots ---------- */
      .fb-dots {
        display: flex;
        gap: 6px;
      }
      .fb-dots span {
        width: 10px;
        height: 10px;
        background: #1877f2;
        border-radius: 50%;
        animation: fbBounce 1.4s infinite ease-in-out both;
      }
      .fb-dots span:nth-child(1) {
        animation-delay: -0.32s;
      }
      .fb-dots span:nth-child(2) {
        animation-delay: -0.16s;
      }
      @keyframes fbBounce {
        0%,
        80%,
        100% {
          transform: scale(0);
        }
        40% {
          transform: scale(1);
        }
      }

      /* ---------- bottom footer ---------- */
      .bottom-footer {
        font-size: 0.9rem;
        color: #6b7280;
      }
    </style>

    <!-- Google cursive font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap"
      rel="stylesheet"
    />

    <script>
      /* auto-hide after 4 s or call window.__removePreloader() from React */
      const hide = () => {
        const p = document.getElementById("preloader");
        p.style.opacity = "0";
        setTimeout(() => p.remove(), 10000);
      };
      setTimeout(hide, 10000);
      window.__removePreloader = hide;
    </script>

  </body>
</html>
