<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGradeZapp</title>
    <link rel="icon" href="/WebGradeZapp/cologo.png" />
    <script src="https://cdn.lordicon.com/lordicon.js"></script>

    <!-- Google cursive font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }

      /* ---------- full-screen wrapper ---------- */
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        background: #ffffff;
        transition: opacity 0.6s ease;
        padding: 10vh 0 6vh;
        pointer-events: none;
        overflow: hidden;
      }

      /* ---------- heading ---------- */
      .write-heading {
        font-family: "Dancing Script", cursive;
        font-size: 2.75rem;
        color: #111827;
        text-align: center;
        letter-spacing: 0.5px;
      }
      @media (max-width: 768px) {
        .write-heading {
          font-size: 1.85rem;
        }
      }

      /* ---------- centre content ---------- */
      .center-block {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
      }
      .logo {
        width: 140px;
        height: 140px;
        -o-object-fit: contain;
           object-fit: contain;
        animation: logoSpin 4s linear infinite;
      }

      @keyframes logoSpin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(0deg);
        }
      }

      /* ---------- enhanced facebook bouncing dots ---------- */
      .fb-dots {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
      }

      .fb-dots span {
        width: 12px;
        height: 12px;
        background: #1877f2;
        border-radius: 50%;
        animation: fbBounce 1.4s infinite cubic-bezier(0.4, 0, 0.2, 1);
      }

      .fb-dots span:nth-child(1) {
        animation-delay: 0s;
      }
      .fb-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .fb-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }
      .fb-dots span:nth-child(4) {
        animation-delay: 0.6s;
      }
      .fb-dots span:nth-child(5) {
        animation-delay: 0.8s;
      }

      @keyframes fbBounce {
        0%,
        100% {
          transform: scale(0);
        }
        25% {
          transform: scale(1.3);
        }
        50% {
          transform: scale(0.9);
        }
        75% {
          transform: scale(1.1);
        }
      }

      /* ---------- bottom footer ---------- */
      .bottom-footer {
        font-size: 0.9rem;
        color: #6b7280;
        text-align: center;
      }
    </style>
    <script type="module" crossorigin src="/WebGradeZapp/assets/index-BpYk_TNc.js"></script>
    <link rel="stylesheet" crossorigin href="/WebGradeZapp/assets/index-BbtATJ2j.css">
  </head>
  <body>
    <div id="root"></div>

    <!-- ========== NEW PRELOADER ========== -->
    <div id="preloader">
      <h1 class="write-heading">Welcome to WebGradeZapp</h1>

      <div class="center-block">
        <img src="/WebGradeZapp/cologo.png" alt="logo" class="logo" />
        <div class="fb-dots">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>

      <div class="bottom-footer">Built by <strong>Abdullah Waqas</strong></div>
    </div>

    <script>
      /* Auto-hide preloader after 4s or manually via window.__removePreloader() */
      const hidePreloader = () => {
        const p = document.getElementById("preloader");
        p.style.opacity = 0;
        setTimeout(() => p.remove(), 1000);
      };
      setTimeout(hidePreloader, 4000);
      window.__removePreloader = hidePreloader;
    </script>

  </body>
</html>
